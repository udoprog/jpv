name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release'
        required: true
        default: 'nightly'
        type: choice
        options:
        - nightly
        - "%date"
  push:
    tags:
    - '*'

env:
  KICK_VERSION: >-
    ${{ github.event_name == 'push' && github.ref_name || github.event.inputs.version || 'nightly' }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: dtolnay/rust-toolchain@stable
      with:
        targets: wasm32-unknown-unknown
    - uses: Swatinem/rust-cache@v2
    - uses: udoprog/actions@trug
    - run: trug build --release
    - uses: actions/upload-artifact@v7
      with:
        name: build-frontend
        path: crates/web/dist

  fedora:
    runs-on: ubuntu-latest
    needs: frontend
    strategy:
      fail-fast: false
      matrix:
        fedora: ["44", "45"]
    container:
      image: fedora:${{matrix.fedora}}
    steps:
    - run: cat /etc/fedora-release
    - uses: actions/checkout@v7
    - uses: actions/download-artifact@v8
      with: {name: build-frontend, path: crates/web/dist}
    - uses: dtolnay/rust-toolchain@stable
    - uses: Swatinem/rust-cache@v2
    - run: dnf install --assumeyes gcc rpm-build glib2-devel git 'libssl.so.3()(64bit)'
    - uses: udoprog/actions@kick
    - run: kick define --github-action
      id: release
    - run: cargo build --release --features gnome,bundle,wayland -p jpv
      env:
        JPV_VERSION: ${{steps.release.outputs.version}}
    - run: kick rpm --append fc${{matrix.fedora}} --output dist
    - uses: actions/upload-artifact@v7
      with:
        name: dist-fedora-${{matrix.fedora}}
        path: dist

  # Portable archives for the install script, named jpv-<version>-<arch>-<os>.tar.gz.
  #
  # Tesseract is loaded at runtime, so OCR works wherever tesseract and its
  # Japanese language data are installed, and is turned off otherwise.
  archive:
    runs-on: ${{matrix.os}}
    needs: frontend
    strategy:
      fail-fast: false
      matrix:
        include:
        - {os: ubuntu-latest, features: "reqwest,memmap,gnome,bundle,wayland"}
        - {os: macos-latest, features: "reqwest,memmap,bundle"}
    steps:
    - uses: actions/checkout@v7
    - uses: actions/download-artifact@v8
      with: {name: build-frontend, path: crates/web/dist}
    - uses: dtolnay/rust-toolchain@stable
    - uses: Swatinem/rust-cache@v2
    - run: sudo apt-get install --yes libglib2.0-dev
      if: runner.os == 'Linux'
    - uses: udoprog/actions@kick
    - run: kick define --github-action
      id: release
    - run: cargo build --release --no-default-features --features ${{matrix.features}} -p jpv
      env:
        JPV_VERSION: ${{steps.release.outputs.version}}
    - run: kick gzip --output dist
    - uses: actions/upload-artifact@v7
      with:
        name: dist-archive-${{matrix.os}}
        path: dist

  windows:
    runs-on: windows-latest
    needs: frontend
    steps:
    - uses: udoprog/actions@kick
    - run: kick define --github-action --msi-version-to msi_version
      id: release
    - uses: actions/checkout@v7
    - uses: actions/download-artifact@v8
      with: {name: build-frontend, path: crates/web/dist}
    - uses: dtolnay/rust-toolchain@stable
    - uses: Swatinem/rust-cache@v2
    - run: cargo build --release --features bundle -p jpv
      env:
        JPV_VERSION: ${{steps.release.outputs.version}}
        JPV_MSI_VERSION: ${{steps.release.outputs.msi_version}}
    - run: kick msi --output dist
    - run: kick zip --output dist
    - uses: actions/upload-artifact@v7
      with:
        name: dist-windows
        path: dist

  publish:
    permissions: write-all
    needs: [fedora, archive, windows]
    runs-on: ubuntu-latest
    steps:
    - uses: udoprog/actions@kick
    - uses: actions/download-artifact@v8
      with: {pattern: "dist-*", merge-multiple: true, path: dist}
    - run: kick gh release --github-action --upload "dist/*"
      env:
        GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
