[package]
name = "jpv"
version = "0.0.0"
authors = ["John-John Tedro <udoprog@tedro.se>"]
edition = "2021"
rust-version = "1.95"
description = "Japanese Dictionary by John-John Tedro"
documentation = "https://docs.rs/jpv"
readme = "README.md"
repository = "https://github.com/udoprog/jpv"
license = "MIT OR Apache-2.0"
keywords = ["dictionary"]
categories = ["development-tools"]

default-run = "jpv"

[features]
default = ["reqwest", "memmap"]
reqwest = ["dep:reqwest", "dep:tar", "dep:zip"]
bundle = ["rust-embed", "mime_guess"]
gnome = ["gio", "dbus"]
memmap = ["lib/memmap"]
cli = []
dbus = ["dep:tokio-dbus"]
wayland = ["dep:wayland-client", "dep:wayland-protocols", "dep:wayland-protocols-wlr"]

[dependencies]
lib = { package = "jpv-lib", path = "../jpv-lib" }
tesseract = { package = "jpv-tesseract", path = "../jpv-tesseract" }
anyhow = "1.0.75"
axum = { version = "0.8.6", features = ["ws"] }
bytes = "1.6.0"
mime = "0.3.17"
tokio = { version = "1.33.0", features = ["full"] }
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.17", features = ["env-filter"] }
serde = { version = "1.0.189", features = ["derive"] }
clap = { version = "4.4.6", features = ["derive"] }
tower-http = { version = "0.7.1", features = ["cors"] }
musli = { version = "0.2.0", features = ["storage", "json"] }
musli-zerocopy = "0.1.4"

fixed-map = { version = "0.9.3", features = ["serde"] }
rust-embed = { version = "8.0.0", optional = true }
mime_guess = { version = "2.0.4", optional = true }
async-fuse = "1.0.1"
webbrowser = "1.0.0"
serde_json = "1.0.108"
flate2 = "1.0.28"
reqwest = { version = "0.13.3", optional = true }
rand = "0.10.1"
image = "0.25.8"
tempfile = "3.8.1"
slab = "0.4.9"
twox-hash = { version = "2.1.2", default-features = false, features = ["xxhash64"] }
parking_lot = "0.13.0"
num_cpus = "1.16.0"
tokio-stream = "0.1.15"
directories = "6.0.0"

[target.'cfg(unix)'.dependencies]
tokio-dbus = { version = "0.2.4", optional = true }
gio = { version = "0.22.6", optional = true }

[target.'cfg(not(windows))'.dependencies]
tar = { version = "0.4.46", optional = true }

[target.'cfg(windows)'.dependencies]
winctx = "0.0.20"
zip = { version = "9.6.1", default-features = false, features = ["deflate-flate2"], optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
wayland-client = { version = "0.31.15", optional = true }
wayland-protocols = { version = "0.32.13", features = ["client", "staging"], optional = true }
wayland-protocols-wlr = { version = "0.3.12", features = ["client"], optional = true }

[build-dependencies]
anyhow = "1.0.75"
winres = "0.1.12"

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/jpv", dest = "/usr/bin/", mode = "755" },
    { source = "desktop/se.tedro.JapaneseDictionary.desktop", dest = "/usr/share/applications/", mode = "644" },
    { source = "desktop/se.tedro.JapaneseDictionary.png", dest = "/usr/share/icons/hicolor/256x256/apps/", mode = "644" },
    { source = "desktop/se.tedro.JapaneseDictionary.service", dest = "/usr/share/dbus-1/services/", mode = "644" },
    { source = "gnome/jpv@tedro.se/*.js", dest = "/usr/share/gnome-shell/extensions/jpv@tedro.se/", mode = "644" },
    { source = "gnome/jpv@tedro.se/*.json", dest = "/usr/share/gnome-shell/extensions/jpv@tedro.se/", mode = "644" },
    { source = "gnome/jpv@tedro.se/*.css", dest = "/usr/share/gnome-shell/extensions/jpv@tedro.se/", mode = "644" },
    { source = "gnome/jpv@tedro.se/schemas/*", dest = "/usr/share/gnome-shell/extensions/jpv@tedro.se/schemas/", mode = "644" },
]

[package.metadata.generate-rpm.requires]
tesseract-langpack-jpn = "*"
