[package]
name = "web"
edition = "2021"
publish = false

[features]
cli = []

[dependencies]
lib = { package = "jpv-lib", path = "../jpv-lib" }
yew = { version = "0.23.0", features = ["csr"] }
musli = { version = "0.2.0", features = ["storage"] }
anyhow = "1.0.75"
log = "0.4.20"
wasm-logger = "0.2.0"
yew-router = "0.20.0"
serde = { version = "1.0.189", features = ["derive"] }
gloo-utils = "0.3.0"
gloo-timers = "0.4.0"
wasm-bindgen-futures = "0.4.37"
serde_json = "1.0.107"
url = "2.4.1"
thiserror = "2.0.0"
wasm-bindgen = { version = "0.2.87", features = ["std"] }
borrowme = "0.1.0"
serde_urlencoded = "0.7.1"
slab = "0.4.9"
sockel = { version = "0.4.1", default-features = false, features = ["layout", "shell", "split-view", "button", "overlay", "input", "tabs", "notice", "checkbox", "choice", "badge", "field", "select", "chip", "log-view", "icons", "menu", "tooltip", "rows", "file-browser"] }
phrasebook = { version = "0.2.0", features = ["yew023", "browser", "koine03"] }

[dependencies.web-sys]
version = "0.3.81"
features = [
    "WebSocket",
    "HtmlSelectElement",
    "Performance",
    "Storage",
    "Navigator",
    "Clipboard",
]

[build-dependencies]
sockel-build = "0.4.1"

[dev-dependencies]
sockel-build = "0.4.1"
